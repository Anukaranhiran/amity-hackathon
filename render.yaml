# Render Blueprint — Shulker (backend + sandbox in one service)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shulker-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run typecheck --workspaces --if-present
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SANDBOX_PORT
        value: "8700"
      - key: SANDBOX_JWT_SECRET
        generateValue: true
      - key: BIND_HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard (optional — deterministic mode without it)
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
